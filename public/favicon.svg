<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset=".55" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="strip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fb7185"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="glow" cx=".82" cy=".16" r=".62">
      <stop offset="0" stop-color="#fb7185" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fb7185" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="body"><rect x="110" y="150" width="292" height="248" rx="40"/></clipPath>
  </defs>

  <rect width="512" height="512" rx="120" fill="url(#bg)"/>
  <rect width="512" height="512" rx="120" fill="url(#glow)"/>
  <rect width="512" height="512" rx="120" fill="url(#sheen)"/>

  <!-- binding rings -->
  <rect x="172" y="116" width="26" height="72" rx="13" fill="#ffffff"/>
  <rect x="314" y="116" width="26" height="72" rx="13" fill="#ffffff"/>

  <!-- calendar body -->
  <rect x="110" y="150" width="292" height="248" rx="40" fill="#ffffff"/>
  <!-- warm header strip -->
  <rect x="110" y="150" width="292" height="60" fill="url(#strip)" clip-path="url(#body)"/>

  <!-- check -->
  <path d="M186 312 l44 46 l98 -112" fill="none" stroke="#4f46e5"
    stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
